<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Court Call — Pickleball Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10151b;
    --surface: #171e26;
    --line: #2a333d;
    --ball: #d9f04b;
    --ball-dim: #a7b93a;
    --ink: #f5f7f2;
    --muted: #7c8a97;
    --danger: #e2604f;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, #1a222b 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow-y: auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    user-select:none;
  }

  header{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:flex-end;
    padding: max(6px, env(safe-area-inset-top)) 14px 0;
  }
  .header-right{ display:flex; align-items:center; gap:4px; }
  .iconbtn{
    background:none; border:none; color:var(--muted); padding:5px 6px;
    cursor:pointer; font-size:15px; -webkit-tap-highlight-color: transparent;
  }
  .iconbtn:active{ color: var(--ink); }

  .scoreboard{
    position:relative; z-index:1;
    margin: 4px 16px 0;
    display:grid;
    grid-template-columns: 1fr 30px 1fr;
    align-items:stretch;
  }
  .sb-divider{ display:flex; justify-content:center; }
  .sb-divider-line{ width:1px; background: var(--line); align-self:stretch; }
  .sb-box{
    display:flex; align-items:center; gap:8px;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .sb-box.left{ border-radius: 10px 0 0 10px; border-right:none; }
  .sb-box.right{ border-radius: 0 10px 10px 0; border-left:none; }
  .sb-serve{
    width:12px; flex-shrink:0; text-align:center;
    color: var(--ball); font-size:10px; opacity:0;
  }
  .sb-serve.active{
    opacity:1;
    animation: servePulseText 2s ease-in-out infinite;
  }
  @keyframes servePulseText{
    0%,100%{ opacity:1; } 50%{ opacity:0.35; }
  }
  .sb-name-block{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .sb-name-input{
    width:100%;
    background:none; border:none; color: var(--ink);
    font-family:'Inter'; font-weight:600; font-size:13px;
    padding:0;
  }
  .sb-hint{
    font-family:'JetBrains Mono', monospace; font-size:9px; color: var(--muted);
    letter-spacing:0.02em;
  }
  .sb-server-num{
    font-family:'JetBrains Mono', monospace; font-size:9px;
    color:#10151b; background: var(--ball);
    padding: 1px 4px; border-radius:4px;
    display:none; font-weight:700; width:fit-content;
  }
  .sb-server-num.show{ display:block; }
  .sb-counts{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .sb-games-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; color: var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:1px;
  }
  .sb-games-label b{ color: var(--ball-dim); font-size:12px; }
  .sb-history{ display:flex; gap:3px; }
  .sb-history .histcol{
    min-width:20px; text-align:center;
    font-family:'JetBrains Mono', monospace; font-size:10px;
    color: var(--muted);
    padding: 2px 3px; border-radius:5px;
    background: var(--bg);
  }

  main{
    position:relative; z-index:1;
    flex:1;
    min-height:0;
    display:grid; grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding: 0 4px;
  }
  .score-zone{
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    position:relative;
  }
  .score-zone:active{ background: rgba(217,240,75,0.04); }
  .score-num{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: min(34vw, 42vh, 220px);
    line-height:0.85;
    letter-spacing: 0.01em;
    color: var(--ink);
    -webkit-text-stroke: 1.5px var(--ink);
    transition: transform .12s ease, color .12s ease, opacity .12s ease;
    opacity: 0.35;
  }
  .score-zone.serving .score-num{ opacity: 1; }
  .score-zone.pulse .score-num{ transform: scale(1.06); color: var(--ball); -webkit-text-stroke-color: var(--ball); }

  .divider{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding: 0 6px;
    height:60%;
  }
  .divider-line{ flex:1; width:1px; background: var(--line); }
  .ball-icon{ width:20px; height:20px; flex-shrink:0; opacity:0.9; }

  .controls-row{
    position:relative; z-index:1;
    display:flex;
    justify-content:center;
    padding: 6px 0 10px;
  }
  .undo-btn{
    background: var(--surface); border:1px solid var(--line); color: var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:11px;
    padding: 8px 14px; border-radius:20px;
    display:flex; align-items:center; gap:6px;
  }
  .undo-btn:active{ color: var(--ink); border-color: var(--muted); }

  .footer{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 18px max(18px, env(safe-area-inset-bottom));
    font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted);
    flex-wrap: wrap;
    gap: 10px;
  }
  .tts-toggle{ display:flex; align-items:center; gap:8px; }
  .switch{
    width:34px; height:19px; border-radius:10px; background: var(--surface);
    border:1px solid var(--line); position:relative; cursor:pointer;
  }
  .switch .knob{
    position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
    background: var(--muted); transition: all .15s ease;
  }
  .switch.on{ border-color: var(--ball-dim); }
  .switch.on .knob{ left:17px; background: var(--ball); }

  .reset-hold{
    position:relative; overflow:hidden;
    background:none; border:1px solid var(--line); color: var(--danger);
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.05em;
    padding:6px 10px; border-radius:14px;
  }
  .reset-hold .fill{
    position:absolute; left:0; top:0; bottom:0; width:0%; background: rgba(226,96,79,0.25);
    transition: width linear;
  }
  .reset-hold span{ position:relative; }

  .toast{
    position:fixed; left:50%; bottom:70px; transform:translateX(-50%);
    background: var(--surface); border:1px solid var(--line); color: var(--ink);
    padding:8px 16px; border-radius:20px; font-size:12px;
    opacity:0; pointer-events:none; transition: opacity .25s ease;
    z-index: 20; white-space:nowrap; max-width: 88vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  .overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:30;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--surface); border-top:1px solid var(--line);
    border-radius: 18px 18px 0 0;
    width:100%; max-width:480px; padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    font-family:'Inter', sans-serif;
    max-height: 80vh; overflow-y:auto;
  }
  .sheet h3{ margin:0 0 16px; font-size:15px; letter-spacing:0.02em; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color: var(--muted); margin-bottom:8px; font-family:'JetBrains Mono', monospace; letter-spacing:0.05em; }
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; background: var(--bg); border:1px solid var(--line); color: var(--muted);
    padding:9px 6px; border-radius:10px; font-size:13px; font-family:'Inter';
  }
  .seg button.active{ border-color: var(--ball-dim); color: var(--ball); background: rgba(217,240,75,0.06); }
  .num-input{
    width:100%; background: var(--bg); border:1px solid var(--line); color: var(--ink);
    padding:9px 12px; border-radius:10px; font-size:14px; font-family:'JetBrains Mono', monospace;
  }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .sheet-close{
    width:100%; margin-top:6px; background: var(--ball); color:#10151b; border:none;
    padding:12px; border-radius:12px; font-weight:700; font-size:14px;
  }

  @media (orientation: landscape) and (max-height: 500px){
    header{ padding: max(6px, env(safe-area-inset-top)) 16px 2px; }
    .scoreboard{ margin: 2px 16px 0; }
    .sb-box{ padding: 4px 10px; }
    .sb-name-input{ font-size:11px; }
    .controls-row{ padding: 2px 24px 4px; }
    .footer{ padding: 0 18px max(8px, env(safe-area-inset-bottom)); font-size:10px; }
    .undo-btn{ padding:5px 12px; font-size:10px; }
  }
</style>
</head>
<body>

  <header>
    <div class="header-right">
      <button class="iconbtn" id="settingsBtn" title="Match settings">⚙</button>
      <button class="iconbtn" id="helpBtn" title="How to use">?</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="sb-box left">
      <span class="sb-serve" id="serve1">●</span>
      <div class="sb-name-block">

        <span class="sb-server-num" id="serverNum1">SERVER 1</span>
      </div>
      <div class="sb-counts">
        <div class="sb-games-label"><b id="sbGamesCount1">0</b>GAMES</div>
        <div class="sb-history" id="sbHistory1"></div>

    </div>
    <div class="sb-divider"><div class="sb-divider-line"></div></div>
    <div class="sb-box right">
      <span class="sb-serve" id="serve2">●</span>
      <div class="sb-name-block">
        <input class="sb-name-input" id="p2Name" value="Team B" maxlength="14">
        <span class="sb-hint" id="hint2"></span>
        <span class="sb-server-num" id="serverNum2">SERVER 1</span>
      </div>
      <div class="sb-counts">
        <div class="sb-games-label"><b id="sbGamesCount2">0</b>GAMES</div>
        <div class="sb-history" id="sbHistory2"></div>
      </div>
    </div>
  </div>

  <main>
    <div class="score-zone" id="zone1">
      <div class="score-num" id="score1">0</div>
    </div>
    <div class="divider">
      <div class="divider-line"></div>
      <svg class="ball-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="none" stroke="#d9f04b" stroke-width="1.6"/>
        <circle cx="12" cy="5.2" r="1" fill="#d9f04b"/>
        <circle cx="12" cy="18.8" r="1" fill="#d9f04b"/>
        <circle cx="5.2" cy="12" r="1" fill="#d9f04b"/>
        <circle cx="18.8" cy="12" r="1" fill="#d9f04b"/>
        <circle cx="7.5" cy="7.5" r="1" fill="#d9f04b"/>
        <circle cx="16.5" cy="7.5" r="1" fill="#d9f04b"/>
        <circle cx="7.5" cy="16.5" r="1" fill="#d9f04b"/>
        <circle cx="16.5" cy="16.5" r="1" fill="#d9f04b"/>
      </svg>
      <div class="divider-line"></div>
    </div>
    <div class="score-zone" id="zone2">
      <div class="score-num" id="score2">0</div>
    </div>
  </main>

  <div class="controls-row">
    <button class="undo-btn" id="undo1">↺ UNDO (hold button)</button>
  </div>

  <div class="footer">
    <div class="tts-toggle">
      <div class="switch" id="ttsSwitch"><div class="knob"></div></div>
      <span>VOICE</span>
    </div>
    <button class="reset-hold" id="resetBtn"><div class="fill" id="resetFill"></div><span>HOLD TO RESET MATCH</span></button>
  </div>

  <div class="toast" id="toast"></div>

  <video id="noSleepVideo" muted loop playsinline webkit-playsinline
    style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; pointer-events:none; z-index:-1;">

  </video>

  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <h3>MATCH SETTINGS</h3>

      <div class="field">
        <label>FORMAT</label>
        <div class="seg" id="formatSeg">
          <button data-format="singles">Singles</button>
          <button data-format="doubles">Doubles</button>
        </div>
      </div>

      <div class="field">
        <label>MATCH LENGTH (games to win)</label>
        <div class="seg" id="matchLenSeg">
          <button data-games="1">1 Game</button>
          <button data-games="2">Best of 3</button>
          <button data-games="3">Best of 5</button>
          <button data-games="custom">Custom</button>
        </div>
        <input class="num-input" id="customGamesInput" type="number" min="1" max="9" value="1" style="margin-top:8px; display:none;">
      </div>

      <div class="field">
        <label>POINTS PER GAME (first to)</label>
        <div class="seg" id="pointsSeg">
          <button data-points="11">11</button>
          <button data-points="15">15</button>
          <button data-points="21">21</button>
          <button data-points="custom">Custom</button>
        </div>
        <input class="num-input" id="customPointsInput" type="number" min="3" max="25" value="11" style="margin-top:8px; display:none;">
      </div>

      <div class="field row-between">
        <label style="margin:0;">WIN BY 2</label>
        <div class="switch" id="winByTwoSwitch"><div class="knob"></div></div>
      </div>

      <div class="field">
        <label>SERVING FIRST</label>
        <div class="seg" id="serverSeg">
          <button data-server="1">Team A</button>
          <button data-server="2">Team B</button>
        </div>
      </div>

      <div class="field">
        <label>CALLER VOICE</label>
        <select class="num-input" id="voiceSelect"></select>
      </div>

      <button class="sheet-close" id="settingsClose">DONE</button>
    </div>
  </div>

  <div class="overlay" id="resumeOverlay">
    <div class="sheet">
      <h3>RESUME MATCH?</h3>
      <p style="font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.5;">
        A previous match from <span id="resumeAgeText">a while</span> ago was found. Continue it, or start a new match?
      </p>
      <button class="sheet-close" id="resumeContinueBtn" style="margin-bottom:10px;">CONTINUE PREVIOUS MATCH</button>
      <button class="sheet-close" id="resumeNewBtn" style="background:var(--surface); color:var(--ink); border:1px solid var(--line);">START NEW MATCH</button>
    </div>
  </div>

<script>
(function(){
  const config = {
    format: 'singles',      // 'singles' or 'doubles'
    gamesToWin: 1,           // games needed to win the match (1 = single game)
    gamesToWinCustom: false,
    pointsToWin: 11,
    pointsToWinCustom: false,
    winByTwo: true
  };

  const state = {
    score1: 0, score2: 0,
    gamesWon1: 0, gamesWon2: 0,
    gameHistory: [], // completed games: [{s1,s2}, ...]
    servingTeam: 1,
    serverNumber: 1,
    firstServiceUsed: false,
    ttsOn: false,
    selectedVoiceURI: null,
    history: [],
    matchOver: false
  };

  const el = {
    score1: document.getElementById('score1'),
    score2: document.getElementById('score2'),
    zone1: document.getElementById('zone1'),
    zone2: document.getElementById('zone2'),
    serve1: document.getElementById('serve1'),
    serve2: document.getElementById('serve2'),
    serverNum1: document.getElementById('serverNum1'),
    serverNum2: document.getElementById('serverNum2'),
    hint1: document.getElementById('hint1'),
    hint2: document.getElementById('hint2'),
    sbGamesCount1: document.getElementById('sbGamesCount1'),
    sbGamesCount2: document.getElementById('sbGamesCount2'),
    sbHistory1: document.getElementById('sbHistory1'),
    sbHistory2: document.getElementById('sbHistory2'),
    p1Name: document.getElementById('p1Name'),
    p2Name: document.getElementById('p2Name'),
    undo1: document.getElementById('undo1'),
    ttsSwitch: document.getElementById('ttsSwitch'),
    resetBtn: document.getElementById('resetBtn'),
    resetFill: document.getElementById('resetFill'),
    toast: document.getElementById('toast'),
    helpBtn: document.getElementById('helpBtn'),
    settingsBtn: document.getElementById('settingsBtn'),
    settingsOverlay: document.getElementById('settingsOverlay'),
    settingsClose: document.getElementById('settingsClose'),
    formatSeg: document.getElementById('formatSeg'),
    matchLenSeg: document.getElementById('matchLenSeg'),
    customGamesInput: document.getElementById('customGamesInput'),
    pointsSeg: document.getElementById('pointsSeg'),
    customPointsInput: document.getElementById('customPointsInput'),
    winByTwoSwitch: document.getElementById('winByTwoSwitch'),
    serverSeg: document.getElementById('serverSeg'),
    voiceSelect: document.getElementById('voiceSelect'),
    resumeOverlay: document.getElementById('resumeOverlay'),
    resumeAgeText: document.getElementById('resumeAgeText'),
    resumeContinueBtn: document.getElementById('resumeContinueBtn'),
    resumeNewBtn: document.getElementById('resumeNewBtn')
  };

  function names(){
    return [el.p1Name.value || 'Team A', el.p2Name.value || 'Team B'];
  }

  // Persist match + settings to localStorage so switching apps, locking the
  // phone, or the tab reloading in the background doesn't lose the match.
  const STORAGE_KEY = 'courtcall_pickleball_v1';
  const RESUME_THRESHOLD_MS = 3 * 60 * 60 * 1000; // 3 hours

  function saveState(){
    try{
      const payload = {
        savedAt: Date.now(),
        config: config,
        state: {
          score1: state.score1, score2: state.score2,
          gamesWon1: state.gamesWon1, gamesWon2: state.gamesWon2,
          gameHistory: state.gameHistory,
          servingTeam: state.servingTeam, serverNumber: state.serverNumber,
          firstServiceUsed: state.firstServiceUsed, matchOver: state.matchOver,
          ttsOn: state.ttsOn, selectedVoiceURI: state.selectedVoiceURI
        },
        names: { p1: el.p1Name.value, p2: el.p2Name.value }
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }catch(e){ /* storage unavailable - skip */ }
  }

  function loadSavedPayload(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }

  function hasMatchProgress(s){
    if(!s) return false;
    return s.score1>0 || s.score2>0 || s.gamesWon1>0 || s.gamesWon2>0 || s.matchOver;
  }

  function formatAge(ms){
    const hours = Math.round(ms / (60*60*1000));
    if(hours < 1) return 'less than an hour';
    if(hours === 1) return '1 hour';
    if(hours < 48) return hours + ' hours';
    const days = Math.round(hours/24);
    return days + (days===1 ? ' day' : ' days');
  }

  function pushHistory(){
    state.history.push(JSON.stringify({
      score1: state.score1, score2: state.score2,
      gamesWon1: state.gamesWon1, gamesWon2: state.gamesWon2,
      gameHistory: state.gameHistory,
      servingTeam: state.servingTeam, serverNumber: state.serverNumber,
      firstServiceUsed: state.firstServiceUsed, matchOver: state.matchOver
    }));
    if(state.history.length > 100) state.history.shift();
  }

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> el.toast.classList.remove('show'), 1800);
  }

  function speak(text){
    if(!state.ttsOn) return;
    if(!('speechSynthesis' in window)){
      showToast('Speech synthesis not supported on this device');
      return;
    }
    const doSpeak = () => {
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices();
      let chosen = null;
      if(state.selectedVoiceURI){
        chosen = voices.find(v => v.voiceURI === state.selectedVoiceURI) || null;
      }
      if(!chosen){
        chosen = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
      }
      const u = new SpeechSynthesisUtterance(text);
      if(chosen){ u.voice = chosen; u.lang = chosen.lang; }
      else { u.lang = 'en-US'; }
      u.rate = 1.0;
      u.onerror = (ev) => showToast('Voice error: ' + (ev.error || 'unknown'));
      window.speechSynthesis.speak(u);
    };
    const voices = window.speechSynthesis.getVoices();
    if(voices && voices.length){ doSpeak(); }
    else {
      window.speechSynthesis.onvoiceschanged = doSpeak;
      setTimeout(doSpeak, 300);
    }
  }

  function voiceDisplayLabel(v){
    const n = v.name.toLowerCase();
    if(n.includes('female')) return '♀ ' + v.name + ' (' + v.lang + ')';
    if(n.includes('male'))   return '♂ ' + v.name + ' (' + v.lang + ')';
    return v.name + ' (' + v.lang + ')';
  }

  function populateVoiceList(){
    if(!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    if(!voices.length) return;
    const prev = state.selectedVoiceURI;
    el.voiceSelect.innerHTML = '';
    const autoOpt = document.createElement('option');
    autoOpt.value = '';
    autoOpt.textContent = 'Auto (default English voice)';
    el.voiceSelect.appendChild(autoOpt);

    const male = voices.filter(v => v.name.toLowerCase().includes('male') && !v.name.toLowerCase().includes('female'));
    const female = voices.filter(v => v.name.toLowerCase().includes('female'));
    const other = voices.filter(v => !male.includes(v) && !female.includes(v));
    [...male, ...female, ...other].forEach(v=>{
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = voiceDisplayLabel(v);
      el.voiceSelect.appendChild(opt);
    });
    el.voiceSelect.value = prev || '';
  }
  if('speechSynthesis' in window){
    populateVoiceList();
    window.speechSynthesis.onvoiceschanged = populateVoiceList;
  }

  function initialServerNumber(){
    return (config.format === 'doubles' && !state.firstServiceUsed) ? 2 : 1;
  }

  function currentCallText(){
    const servingScore = state.servingTeam === 1 ? state.score1 : state.score2;
    const receivingScore = state.servingTeam === 1 ? state.score2 : state.score1;
    if(config.format === 'doubles'){
      return servingScore + ', ' + receivingScore + ', ' + state.serverNumber;
    }
    return servingScore + ', ' + receivingScore;
  }

  function render(){
    el.score1.textContent = state.score1;
    el.score2.textContent = state.score2;

    el.zone1.classList.toggle('serving', state.servingTeam === 1);
    el.zone2.classList.toggle('serving', state.servingTeam === 2);
    el.serve1.classList.toggle('active', state.servingTeam === 1);
    el.serve2.classList.toggle('active', state.servingTeam === 2);

    const showServerNum = config.format === 'doubles';
    el.serverNum1.classList.toggle('show', showServerNum && state.servingTeam === 1);
    el.serverNum2.classList.toggle('show', showServerNum && state.servingTeam === 2);
    el.serverNum1.textContent = 'SERVER ' + state.serverNumber;
    el.serverNum2.textContent = 'SERVER ' + state.serverNumber;

    if(state.servingTeam === 1){
      el.hint1.textContent = '1× press = point';
      el.hint2.textContent = '2× press = side out';
    } else {
      el.hint1.textContent = '2× press = side out';
      el.hint2.textContent = '1× press = point';
    }

    el.sbGamesCount1.textContent = state.gamesWon1;
    el.sbGamesCount2.textContent = state.gamesWon2;
    renderHistory();
    saveState();
  }

  function renderHistory(){
    function buildCols(container, isTeam1){
      container.innerHTML = '';
      state.gameHistory.forEach(g=>{
        const span = document.createElement('span');
        span.className = 'histcol';
        span.textContent = isTeam1 ? g.s1 : g.s2;
        container.appendChild(span);
      });
    }
    buildCols(el.sbHistory1, true);
    buildCols(el.sbHistory2, false);
  }

  function pulse(zoneEl){
    zoneEl.classList.add('pulse');
    setTimeout(()=> zoneEl.classList.remove('pulse'), 140);
  }

  function checkGameWin(){
    const s1 = state.score1, s2 = state.score2;
    const target = config.pointsToWin;
    const leaderReached = s1 >= target || s2 >= target;
    if(!leaderReached) return false;
    if(config.winByTwo && Math.abs(s1 - s2) < 2) return false;
    return true;
  }

  function finishGame(winner){
    state.gameHistory.push({s1: state.score1, s2: state.score2});
    if(winner===1) state.gamesWon1++; else state.gamesWon2++;

    const [n1, n2] = names();
    const winnerName = winner===1 ? n1 : n2;
    const winnerGames = winner===1 ? state.gamesWon1 : state.gamesWon2;

    if(winnerGames >= config.gamesToWin){
      state.matchOver = true;
      render();
      showToast(winnerName + ' wins the match!');
      speak('Game, Match, ' + winnerName);
      return;
    }

    // set up the next game
    state.score1 = 0; state.score2 = 0;
    state.servingTeam = state.servingTeam === 1 ? 2 : 1;
    state.firstServiceUsed = false;
    state.serverNumber = initialServerNumber();
    render();
    showToast(winnerName + ' wins the game');
    speak('Game, ' + winnerName);
  }

  // event === 'server' -> serving side won the rally (point)
  // event === 'receiver' -> receiving side won the rally (side out, service change)
  function handleRally(event){
    if(state.matchOver) return;
    pushHistory();

    if(event === 'server'){
      if(state.servingTeam === 1) state.score1++; else state.score2++;
      pulse(state.servingTeam === 1 ? el.zone1 : el.zone2);

      if(checkGameWin()){
        finishGame(state.score1 > state.score2 ? 1 : 2);
        return;
      }
      render();
      speak(currentCallText());
      return;
    }

    // receiver won the rally -> side out logic
    if(config.format === 'singles'){
      state.servingTeam = state.servingTeam === 1 ? 2 : 1;
      state.serverNumber = 1;
      render();
      showToast('Side out');
      speak(currentCallText());
      return;
    }

    // doubles
    if(!state.firstServiceUsed){
      state.firstServiceUsed = true;
      state.servingTeam = state.servingTeam === 1 ? 2 : 1;
      state.serverNumber = 1;
      render();
      showToast('Side out');
      speak(currentCallText());
      return;
    }

    if(state.serverNumber === 1){
      state.serverNumber = 2;
      render();
      showToast('Second server');
      speak(currentCallText());
    } else {
      state.servingTeam = state.servingTeam === 1 ? 2 : 1;
      state.serverNumber = 1;
      render();
      showToast('Side out');
      speak(currentCallText());
    }
  }

  function undo(){
    if(state.history.length === 0) return;
    const prev = JSON.parse(state.history.pop());
    Object.assign(state, prev);
    render();
    showToast('Point undone');
    try{
      if(state.matchOver){
        speak('Undo');
      } else {
        speak('Undo, ' + currentCallText());
      }
    } catch(err){
      showToast('Undo voice error: ' + err.message);
    }
  }

  el.zone1.addEventListener('click', ()=>{
    handleRally(state.servingTeam === 1 ? 'server' : 'receiver');
  });
  el.zone2.addEventListener('click', ()=>{
    handleRally(state.servingTeam === 2 ? 'server' : 'receiver');
  });
  el.undo1.addEventListener('click', (e)=>{ e.stopPropagation(); undo(); });
  el.serve1.addEventListener('click', (e)=>{
    e.stopPropagation();
    state.servingTeam = 1; state.serverNumber = initialServerNumber(); render();
  });
  el.serve2.addEventListener('click', (e)=>{
    e.stopPropagation();
    state.servingTeam = 2; state.serverNumber = initialServerNumber(); render();
  });

  el.ttsSwitch.addEventListener('click', ()=>{
    state.ttsOn = !state.ttsOn;
    el.ttsSwitch.classList.toggle('on', state.ttsOn);
    if(state.ttsOn) speak('Voice on');
    saveState();
  });

  function refreshSettingsUI(){
    [...el.formatSeg.children].forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.format === config.format);
    });

    [...el.matchLenSeg.children].forEach(btn=>{
      if(btn.dataset.games === 'custom'){
        btn.classList.toggle('active', config.gamesToWinCustom);
      } else {
        btn.classList.toggle('active', !config.gamesToWinCustom && Number(btn.dataset.games) === config.gamesToWin);
      }
    });
    el.customGamesInput.style.display = config.gamesToWinCustom ? 'block' : 'none';
    el.customGamesInput.value = config.gamesToWin;

    [...el.pointsSeg.children].forEach(btn=>{
      if(btn.dataset.points === 'custom'){
        btn.classList.toggle('active', config.pointsToWinCustom);
      } else {
        btn.classList.toggle('active', !config.pointsToWinCustom && Number(btn.dataset.points) === config.pointsToWin);
      }
    });
    el.customPointsInput.style.display = config.pointsToWinCustom ? 'block' : 'none';
    el.customPointsInput.value = config.pointsToWin;

    el.winByTwoSwitch.classList.toggle('on', config.winByTwo);

    [...el.serverSeg.children].forEach(btn=>{
      btn.classList.toggle('active', Number(btn.dataset.server) === state.servingTeam);
    });
    el.voiceSelect.value = state.selectedVoiceURI || '';
    saveState();
  }
  el.settingsBtn.addEventListener('click', ()=>{
    refreshSettingsUI();
    el.settingsOverlay.classList.add('show');
  });
  el.settingsClose.addEventListener('click', ()=>{
    el.settingsOverlay.classList.remove('show');
  });
  el.settingsOverlay.addEventListener('click', (e)=>{
    if(e.target === el.settingsOverlay) el.settingsOverlay.classList.remove('show');
  });
  [...el.formatSeg.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      config.format = btn.dataset.format;
      if(!state.firstServiceUsed) state.serverNumber = initialServerNumber();
      refreshSettingsUI();
      render();
    });
  });
  [...el.matchLenSeg.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.games === 'custom'){
        config.gamesToWinCustom = true;
        config.gamesToWin = parseInt(el.customGamesInput.value, 10) || config.gamesToWin;
      } else {
        config.gamesToWinCustom = false;
        config.gamesToWin = Number(btn.dataset.games);
      }
      refreshSettingsUI();
    });
  });
  el.customGamesInput.addEventListener('change', ()=>{
    let v = parseInt(el.customGamesInput.value, 10);
    if(isNaN(v) || v < 1) v = 1;
    if(v > 9) v = 9;
    el.customGamesInput.value = v;
    config.gamesToWin = v;
    saveState();
  });
  [...el.pointsSeg.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.points === 'custom'){
        config.pointsToWinCustom = true;
        config.pointsToWin = parseInt(el.customPointsInput.value, 10) || config.pointsToWin;
      } else {
        config.pointsToWinCustom = false;
        config.pointsToWin = Number(btn.dataset.points);
      }
      refreshSettingsUI();
    });
  });
  el.customPointsInput.addEventListener('change', ()=>{
    let v = parseInt(el.customPointsInput.value, 10);
    if(isNaN(v) || v < 3) v = 3;
    if(v > 25) v = 25;
    el.customPointsInput.value = v;
    config.pointsToWin = v;
    saveState();
  });
  el.winByTwoSwitch.addEventListener('click', ()=>{
    config.winByTwo = !config.winByTwo;
    el.winByTwoSwitch.classList.toggle('on', config.winByTwo);
    saveState();
  });
  [...el.serverSeg.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.servingTeam = Number(btn.dataset.server);
      state.serverNumber = initialServerNumber();
      refreshSettingsUI();
      render();
    });
  });
  el.voiceSelect.addEventListener('change', ()=>{
    state.selectedVoiceURI = el.voiceSelect.value || null;
    speak('Voice selected');
    saveState();
  });

  // hold-to-reset
  let holdTimer = null;
  const HOLD_MS = 1200;
  function startHold(){
    el.resetFill.style.transition = 'none';
    el.resetFill.style.width = '0%';
    requestAnimationFrame(()=>{
      el.resetFill.style.transition = 'width ' + HOLD_MS + 'ms linear';
      el.resetFill.style.width = '100%';
    });
    holdTimer = setTimeout(()=>{
      state.score1=0; state.score2=0; state.gamesWon1=0; state.gamesWon2=0;
      state.gameHistory=[]; state.history=[];
      state.firstServiceUsed=false; state.matchOver=false;
      state.serverNumber = initialServerNumber();
      render();
      showToast('Match reset');
      endHold();
    }, HOLD_MS);
  }
  function endHold(){
    clearTimeout(holdTimer);
    el.resetFill.style.transition = 'width 120ms ease';
    el.resetFill.style.width = '0%';
  }
  el.resetBtn.addEventListener('mousedown', startHold);
  el.resetBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); startHold(); }, {passive:false});
  el.resetBtn.addEventListener('mouseup', endHold);
  el.resetBtn.addEventListener('mouseleave', endHold);
  el.resetBtn.addEventListener('touchend', endHold);

  // BLE clicker: 1 press = server wins rally (point), 2 presses = receiver wins (side out)
  const DOUBLE_PRESS_MS = 1000;
  let bleSeen = false;
  let pendingSingleTimer = null;
  let pressCount = 0;

  function markBleOk(){
    if(!bleSeen){
      bleSeen = true;
      showToast('Clicker connected');
    }
  }

  document.addEventListener('keydown', (e)=>{
    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;

    if(e.key === 'u' || e.key === 'U'){
      e.preventDefault();
      markBleOk();
      undo();
      return;
    }

    if(e.code !== 'Space' && e.key !== ' ') return;
    e.preventDefault();
    markBleOk();

    pressCount++;
    if(pressCount === 1){
      pendingSingleTimer = setTimeout(()=>{
        handleRally('server');
        pressCount = 0;
      }, DOUBLE_PRESS_MS);
    } else if(pressCount >= 2){
      clearTimeout(pendingSingleTimer);
      handleRally('receiver');
      pressCount = 0;
    }
  });

  el.helpBtn.addEventListener('click', ()=>{
    showToast('Button = server point / Double-press = side out / Hold = Undo');
  });

  // Screen Wake Lock + silent-video fallback
  let wakeLock = null;
  let wakeLockTried = false;
  const noSleepVideo = document.getElementById('noSleepVideo');
  function startVideoFallback(){
    if(noSleepVideo) noSleepVideo.play().catch(()=>{});
  }
  async function requestWakeLock(){
    if(!('wakeLock' in navigator)){
      startVideoFallback();
      if(!wakeLockTried){ wakeLockTried = true; showToast('Using fallback to keep screen on'); }
      return;
    }
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      if(!wakeLockTried){ wakeLockTried = true; showToast('Screen will stay on while app is open'); }
      wakeLock.addEventListener('release', ()=>{
        if(document.visibilityState === 'visible') requestWakeLock();
      });
    }catch(e){
      startVideoFallback();
      if(!wakeLockTried){ wakeLockTried = true; showToast('Using fallback to keep screen on'); }
    }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      requestWakeLock();
      startVideoFallback();
    }
  });
  document.addEventListener('pointerdown', ()=>{ requestWakeLock(); startVideoFallback(); }, {once:true});

  let audioUnlocked = false;
  function unlockAudioOnce(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    if('speechSynthesis' in window){
      try{
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        window.speechSynthesis.speak(u);
      }catch(e){}
    }
  }
  document.addEventListener('pointerdown', unlockAudioOnce, {once:true});
  document.addEventListener('keydown', unlockAudioOnce, {once:true});

  let pendingSavedState = null;

  function applyLoadedMatchState(s){
    Object.assign(state, s);
    el.ttsSwitch.classList.toggle('on', state.ttsOn);
    refreshSettingsUI();
    render();
  }

  const saved = loadSavedPayload();
  if(saved){
    if(saved.config) Object.assign(config, saved.config);
    if(saved.names){
      if(saved.names.p1) el.p1Name.value = saved.names.p1;
      if(saved.names.p2) el.p2Name.value = saved.names.p2;
    }
    const age = saved.savedAt ? (Date.now() - saved.savedAt) : Infinity;
    if(hasMatchProgress(saved.state) && age > RESUME_THRESHOLD_MS){
      pendingSavedState = saved.state;
      el.resumeAgeText.textContent = formatAge(age);
      refreshSettingsUI();
      render();
      el.resumeOverlay.classList.add('show');
    } else if(saved.state){
      applyLoadedMatchState(saved.state);
    } else {
      refreshSettingsUI();
      render();
    }
  } else {
    refreshSettingsUI();
    render();
  }

  el.resumeContinueBtn.addEventListener('click', ()=>{
    if(pendingSavedState) applyLoadedMatchState(pendingSavedState);
    pendingSavedState = null;
    el.resumeOverlay.classList.remove('show');
  });
  el.resumeNewBtn.addEventListener('click', ()=>{
    pendingSavedState = null;
    el.resumeOverlay.classList.remove('show');
    saveState();
  });
})();
</script>
</body>
</html>
